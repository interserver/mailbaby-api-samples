[package]
name = "MailBabyRustServerDeprecated"
version = "1.5.0"
authors = ["support@interserver.net"]
description = "**Send emails fast and with confidence through our easy to use [REST](https://en.wikipedia.org/wiki/Representational_state_transfer) API interface.**  # Overview  This is the API interface to the [Mail Baby](https://mail.baby/) Mail services provided by [InterServer](https://www.interserver.net). To use this service you must have an account with us at [my.interserver.net](https://my.interserver.net).  # Mail Orders  Every sending account in MailBaby is backed by a **Mail Order** — a provisioned sending credential with a numeric `id` and a corresponding SMTP username (`mb<id>`).  Most calls accept an optional `id` parameter; when omitted the API automatically selects the first active order on your account. Use `GET /mail` to list all orders, and `GET /mail/{id}` to inspect a single order including its current SMTP password.  # Sending Email  Three sending methods are available depending on your use-case: | Endpoint | Best for | |----------|----------| | `POST /mail/send` | Simple single-recipient messages | | `POST /mail/advsend` | Multiple recipients, CC/BCC, attachments, named contacts | | `POST /mail/rawsend` | Pre-built RFC 822 messages (e.g. DKIM-signed payloads) |  After a successful send each endpoint returns a `GenericResponse` whose `text` field contains the **transaction ID** assigned by the relay.  This ID can later be matched against entries in `GET /mail/log` via the `mailid` query parameter.  # Filtering & Logs  `GET /mail/log` provides paginated access to every message accepted by the relay for your account. Combine any of the query parameters to narrow results — e.g. `from`, `to`, `subject`, `messageId`, `origin`, `mx`, `startDate`/`endDate`, and `delivered`.  # Blocking  Two independent mechanisms exist for suppressing unwanted email: - **Block lists** (`GET /mail/blocks`, `POST /mail/blocks/delete`) — addresses flagged by the   system spam filters (LOCAL_BL_RCPT / MBTRAP rules in rspamd, and suspicious subjects). - **Deny rules** (`GET /mail/rules`, `POST /mail/rules`, `DELETE /mail/rules/{ruleId}`) —   custom rules you configure to reject specific senders, domains, destination addresses, or   subject-line prefixes before a message is even attempted.   # Authentication  In order to use most of the API calls you must pass credentials from the [my.interserver.net](https://my.interserver.net/) site. We support several different authentication methods but the preferred method is to use the **API Key** which you can get from the [Account Security](https://my.interserver.net/account_security) page. Pass your key in the `X-API-KEY` HTTP request header for every protected call. "
license = "GNU GPLv3"
edition = "2018"

[features]
default = ["client", "server", "client-tls"]
client = [
    "multipart", "multipart/client", "swagger/multipart_form",
    "serde_urlencoded",
    "hyper", "percent-encoding", "hyper-util/http1", "hyper-util/http2", "url"
]
# TLS support - automatically selects backend based on target OS:
# - macOS/Windows/iOS: native-tls via hyper-tls
# - Other platforms: OpenSSL via hyper-openssl
# Dependencies are in target-specific sections below
client-tls = [
    "client",
    "dep:native-tls",
    "dep:hyper-tls",
    "dep:openssl",
    "dep:hyper-openssl",
    "swagger/tls"
]
server = [
    "multipart", "multipart/server", "swagger/multipart_form",
   "serde_ignored", "hyper", "percent-encoding", "url",
   
]
cli = [
  "dialoguer",
  "anyhow", "clap", "clap-verbosity-flag", "simple_logger", "tokio"
]
conversion = ["frunk", "frunk_derives", "frunk_core", "frunk-enum-core", "frunk-enum-derive"]

mock = ["mockall"]
validate = [ "serde_valid", "swagger/serdevalid"]

[dependencies]
# Common
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
swagger = { version = "7.0.1", features = ["serdejson", "server", "client"] }
headers = "0.4.1"
log = "0.4.29"

mime = "0.3"
mockall = { version = "0.14", optional = true }
lazy_static = "1.5"
regex = "1.12"


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_valid = { version = "2.0", optional = true }

validator = { version = "0.20", features = ["derive"] }

# Crates included if required by the API definition
multipart = { version = "0.18", default-features = false, optional = true }

# Common between server and client features
bytes = "1.11"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"], optional = true }
hyper-util = { version = "0.1.20", features = ["service"] }
serde_ignored = { version = "0.1.14", optional = true }
url = { version = "2.5", optional = true }

# Client-specific
serde_urlencoded = { version = "0.7.1", optional = true }
tower-service = "0.3.3"

# Server, and client callback-specific
percent-encoding = { version = "2.3.2", optional = true }

# CLI-specific
anyhow = { version = "1", optional = true }
clap = { version = "4.6.0", features = ["env"], optional = true }
clap-verbosity-flag = { version = "3.0", optional = true }
simple_logger = { version = "5.2.0", features = ["stderr"], optional = true }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"], optional = true }
dialoguer = { version = "0.12", optional = true }

# Conversion
frunk = { version = "0.4.4", optional = true }
frunk_derives = { version = "0.4.4", optional = true }
frunk_core = { version = "0.4.4", optional = true }
frunk-enum-derive = { version = "0.3.0", optional = true }
frunk-enum-core = { version = "0.3.0", optional = true }

# TLS dependencies - platform-specific backends
# On macOS/Windows/iOS, use native-tls via hyper-tls
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "ios"))'.dependencies]
native-tls = { version = "0.2", optional = true }
hyper-tls = { version = "0.6", optional = true }

# On other platforms (Linux, etc.), use OpenSSL via hyper-openssl
[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "ios")))'.dependencies]
openssl = { version = "0.10", optional = true }
hyper-openssl = { version = "0.10", optional = true }

[dev-dependencies]
always_send = "0.1.1"
clap = "4.6.0"
env_logger = "0.11"
tokio = { version = "1.50.0", features = ["full"] }
native-tls = "0.2"
pin-project = "1.1.11"

# Bearer authentication, used in examples
jsonwebtoken = {version = "10.3.0", features = ["rust_crypto"]}

[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "ios")))'.dev-dependencies]
openssl = "0.10"
tokio-openssl = "0.6"

[[example]]
name = "MailBabyRustServerDeprecated-client"
path = "examples/client/main.rs"
required-features = ["client"]

[[example]]
name = "MailBabyRustServerDeprecated-server"
path = "examples/server/main.rs"
required-features = ["server"]

[[bin]]
name = "MailBabyRustServerDeprecated"
path = "bin/cli.rs"
required-features = ["client", "cli"]
