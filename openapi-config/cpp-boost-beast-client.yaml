# Description: C++ package and library name.
packageName: CppBoostBeastOpenAPIClient

# Description: C++ export macro placed before public classes and functions. When non-empty, ApiExport.h is generated for Windows DLL export/import handling.
exportMacro: 

# Description: C++ namespace for models (convention: name.space.model).
modelPackage: org.openapitools.client.model

# Description: C++ namespace for apis (convention: name.space.api).
apiPackage: org.openapitools.client.api

# Description: Format handling in composition branch matching. Only 'annotation' is supported: format metadata never affects match counts.
# Available Values:
#    annotation
#         Formats are annotations and do not affect validation
formatAssertionPolicy: annotation

# Description: SSE schema interpretation mode for text/event-stream responses. 'representation' (default): the response schema describes the media representation; callbacks receive an owning SseEvent with raw data, event, id, and retry metadata. 'jsonEventData': decode each complete event data payload against the response schema and pass both the typed value and SseEvent metadata to the callback. Use x-sse-event-data-schema for per-operation typed decoding.
# Available Values:
#    representation
#         Schema describes the media representation; callback receives SseEvent
#    jsonEventData
#         Schema describes each JSON event data payload
sseSchemaMode: representation

# Description: Comma-separated operationIds whose JSON request body conditionally selects text/event-stream (default request property: stream).
# sseOperationIds: 

# Description: Comma-separated operationId=property mappings for the boolean request property that selects SSE.
# sseRequestPropertyMappings: 

# Description: Comma-separated operationId=Model mappings for the JSON schema of each SSE event data payload.
# sseEventTypeMappings: 

# Description: Infer conditional SSE for dual JSON/SSE operations only when the request selector and event model are unambiguous. Enabled by default.
inferConditionalSseOperations: true

# Description: Emit schema-validation IR and kValidateOnDecode=true in generated ValidationTypes.h (default). Set to false to omit the IR for high-throughput clients. Representation diagnostics (non-finite destinations, integer range, required properties) remain active.
compileWithValidation: true

# Description: Treat explicit JSON null values as absent for generated model properties whose schemas do not allow null. Enabled by default to tolerate non-conforming server responses while preserving required-key presence checks; set to false for strict schema decoding. Non-null values remain fully validated.
tolerateNonNullableNulls: true

# Description: Retain undeclared JSON object members in generated object models and re-emit them. Composition validation accepts such members while decoding; set to false for strict additionalProperties handling.
preserveAdditionalProperties: false

